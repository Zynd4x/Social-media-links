<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      text-align: center;
      background-color: hsl(0, 0%, 8%);
      font-family: "Inter", sans-serif;
      max-width: 100%;
    }

    img {
      max-width: 80px;
      border-radius: 60px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      margin: auto;
      align-items: center;
      background-color: hsl(0, 0%, 12%);
      color: white;
      padding: 30px;
      border-radius: 10px;
    }

    .city {
      color:  hsl(75, 94%, 57%);
      font-weight: 600;
    }

    .link {
      display: flex;
      justify-content: center;
      background-color: hsl(0, 0%, 20%);
      color: white;
      margin: 12px 0;
      padding: 10px 88px;
      border-radius: 6px;
      font-weight: 600;
    }

    .describe-container {
      display: flex;
      flex-direction: column;
      line-height: 0;
      margin-bottom: 8px;
    }

    a {
      text-decoration: none;
    }

    .attribution { font-size: 0.6875rem; text-align: center; color: white; }
    .attribution a { color: hsl(228, 96%, 78%); }
  </style>
</head>
<body>
  <main class="main-container">
    <section class="img-container">
      <img src="assets/images/avatar-jessica.jpeg" alt="A picture of a Black women with a Afro">
    </section>
    <section class="describe-container">
      <h1>Jessica Randall</h1>
      <p class="city">London, United Kingdom</p>
    </section>
    <section class="titel-container">
      <p>"Front-end developer and avid reader."</p>
    </section>
    <section class="link-container">
      <a href="#"><div class="link">GitHub</div></a>
      <a href="#"><div class="link">Frontend Mentor</div></a>
      <a href="#"><div class="link">LinkedIn</div></a>
      <a href="#"><div class="link">Twitter</div></a>
      <a href="#"><div class="link">Instagram</div></a>
    </section>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Zynd4x">Zyndi</a>.
  </footer>
</body>
</html>
